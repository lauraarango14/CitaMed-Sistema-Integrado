spring.application.name=SistemaCitasMedicasWeb

spring.datasource.url=jdbc:mysql://localhost:3306/proyecto
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
# Cuenta inicial opcional: solo se crea si ambas variables de entorno están definidas.
citamed.bootstrap.username=${CITAMED_BOOTSTRAP_USERNAME:}
citamed.bootstrap.password=${CITAMED_BOOTSTRAP_PASSWORD:}
